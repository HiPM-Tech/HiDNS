          cp -r client/dist release-dist/client/

          # Install production dependencies
          cd release-dist/server
          npm install --production --no-package-lock
          cd ../..

          # Create start script
          # 必须先 cd 到包所在目录：服务端用 process.cwd() 作为 APP_ROOT 去找 client/dist，
          # 从别处运行（尤其 Finder 双击时 cwd 是 /）会拿不到前端，页面 404。
          printf '#!/bin/bash\ncd "$(dirname "$0")" || exit 1\necho "Starting HiDNS Server..."\nexport NODE_PATH="$(pwd)/server/node_modules"\nexport PATH="$(pwd)/nodejs/bin:$PATH"\n"$(pwd)/nodejs/bin/node" "$(pwd)/server/dist/app.js"\n' > release-dist/Start-HiDNS.sh
          chmod +x release-dist/Start-HiDNS.sh

          # Create tar.gz package
          tar -czf "HiDNS-macOS-ARM-v$VERSION-Package.tar.gz" -C release-dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-package
          path: HiDNS-macOS-ARM-*.tar.gz
          retention-days: 7

  # ============================================================================
  # 阶段 2.6: 构建 SEA 二进制（独立可执行文件）
  # ============================================================================
  build-sea-windows:
    name: Build Windows x64 SEA Binary
    if: inputs.build_sea == true
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary
        shell: pwsh
        run: |
          cd server
          pnpm sea:win
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-windows-x64
          path: server/dist/sea/HiDNS-*.exe
          retention-days: 7

  build-sea-linux-x64:
    name: Build Linux x64 SEA Binary
    if: inputs.build_sea == true
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary
        run: |
          cd server
          pnpm sea:linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-linux-x64
          path: server/dist/sea/HiDNS-*-linux-x64*
          retention-days: 7

  build-sea-linux-arm64:
    name: Build Linux ARM64 SEA Binary
    if: inputs.build_sea == true
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary
        run: |
          cd server
          pnpm sea:linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-linux-arm64
          path: server/dist/sea/HiDNS-*-linux-arm64*
          retention-days: 7

  build-sea-macos-arm:
    name: Build macOS ARM SEA Binary
    if: inputs.build_sea == true
    runs-on: macos-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary
        run: |
          cd server
          pnpm sea:macos
      - name: Smoke test macOS binary
        run: |
          cd server/dist/sea
          BIN=$(ls HiDNS-*-macos-arm* | head -1)
          if [ -z "$BIN" ]; then echo "找不到产物 HiDNS-*-macos-arm*"; ls -1; exit 1; fi
          chmod +x "$BIN"

          # 1) 签名必须有效：无签名的 Mach-O 会被内核在 execve 阶段直接杀掉
          codesign --verify --verbose=2 "$BIN"

          # 2) 架构必须与目标一致（防止 node 下载错架构）
          echo "Mach-O 架构：$(file -b "$BIN")"

          # 3) blob 段必须存在：注入静默失败时二进制看起来是完整的，但一跑就崩
          otool -l "$BIN" | grep -q NODE_SEA_BLOB || { echo "SEA blob 段缺失，注入失败"; exit 1; }

          # 4) 运行冒烟只有在 runner 与目标同架构时才有意义。
          #    x64 二进制在 arm64 runner 上要靠 Rosetta，实测直接 Segmentation fault，
          #    那是执行环境的问题、不是产物的问题，所以这里显式跳过并说明。
          RUNNER_ARCH=$(uname -m)
          if [ "$RUNNER_ARCH" != "arm64" ]; then
            echo "⏭️  runner 为 $RUNNER_ARCH、目标为 arm64，跨架构无法运行，已跳过启动冒烟（签名与架构已校验）"
            exit 0
          fi

          PORT=3399 "./$BIN" > /tmp/smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3399/api/init/status > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3399/api/init/status || { echo 'macOS binary failed to start'; cat /tmp/smoke.log; exit 1; }
          kill $PID 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-macos-arm
          path: server/dist/sea/HiDNS-*-macos-arm*
          retention-days: 7

  build-sea-windows-arm:
    name: Build Windows ARM64 SEA Binary
    if: inputs.build_sea == true
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary (ARM64)
        shell: pwsh
        run: |
          cd server
          pnpm sea:win-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-windows-arm64
          path: server/dist/sea/HiDNS-*.exe
          retention-days: 7

  build-sea-macos-x64:
    name: Build macOS Intel SEA Binary
    if: inputs.build_sea == true
    runs-on: macos-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build server
        run: pnpm --filter dnsmgr-server build
      - name: Build client
        run: pnpm --filter dnsmgr-client build
      - name: Build SEA binary
        run: |
          cd server
          pnpm sea:macos-x64
      - name: Smoke test macOS binary
        run: |
          cd server/dist/sea
          BIN=$(ls HiDNS-*-macos-x64* | head -1)
          if [ -z "$BIN" ]; then echo "找不到产物 HiDNS-*-macos-x64*"; ls -1; exit 1; fi
          chmod +x "$BIN"

          # 1) 签名必须有效：无签名的 Mach-O 会被内核在 execve 阶段直接杀掉
          codesign --verify --verbose=2 "$BIN"

          # 2) 架构必须与目标一致（防止 node 下载错架构）
          echo "Mach-O 架构：$(file -b "$BIN")"

          # 3) blob 段必须存在：注入静默失败时二进制看起来是完整的，但一跑就崩
          otool -l "$BIN" | grep -q NODE_SEA_BLOB || { echo "SEA blob 段缺失，注入失败"; exit 1; }

          # 4) 运行冒烟只有在 runner 与目标同架构时才有意义。
          #    x64 二进制在 arm64 runner 上要靠 Rosetta，实测直接 Segmentation fault，
          #    那是执行环境的问题、不是产物的问题，所以这里显式跳过并说明。
          RUNNER_ARCH=$(uname -m)
          if [ "$RUNNER_ARCH" != "x86_64" ]; then
            echo "⏭️  runner 为 $RUNNER_ARCH、目标为 x86_64，跨架构无法运行，已跳过启动冒烟（签名与架构已校验）"
            exit 0
          fi

          PORT=3398 "./$BIN" > /tmp/smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3398/api/init/status > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3398/api/init/status || { echo 'macOS binary failed to start'; cat /tmp/smoke.log; exit 1; }
          kill $PID 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-macos-x64
          path: server/dist/sea/HiDNS-*-macos-x64*
          retention-days: 7

  # ============================================================================
  # 阶段 3: 并行构建 Docker AMD64 & ARM64
  # ============================================================================
  build-docker-amd64:
    name: Build Docker AMD64
    if: inputs.build_docker == true
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          
          if [ "$IS_PRERELEASE" = "true" ]; then
            # 预发布版本使用 pre 标签
            echo "tag=${IMAGE_BASE}:pre-${VERSION}-amd64" >> $GITHUB_OUTPUT
            echo "manifest_tag=${IMAGE_BASE}:pre-${VERSION}" >> $GITHUB_OUTPUT
          else
            # 正式版本使用版本号标签
            echo "tag=${IMAGE_BASE}:${VERSION}-amd64" >> $GITHUB_OUTPUT
            echo "manifest_tag=${IMAGE_BASE}:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-tags.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output build info
        run: |
          echo "Platform: linux/amd64"
          echo "Tag: ${{ steps.docker-tags.outputs.tag }}"

  build-docker-arm64:
    name: Build Docker ARM64
    if: inputs.build_docker == true
    runs-on: ubuntu-24.04-arm
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          
          if [ "$IS_PRERELEASE" = "true" ]; then
            # 预发布版本使用 pre 标签
            echo "tag=${IMAGE_BASE}:pre-${VERSION}-arm64" >> $GITHUB_OUTPUT
            echo "manifest_tag=${IMAGE_BASE}:pre-${VERSION}" >> $GITHUB_OUTPUT
          else
            # 正式版本使用版本号标签
            echo "tag=${IMAGE_BASE}:${VERSION}-arm64" >> $GITHUB_OUTPUT
            echo "manifest_tag=${IMAGE_BASE}:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output build info
        run: |
          echo "Platform: linux/arm64"
          echo "Tag: ${{ steps.docker-tags.outputs.tag }}"

  # ============================================================================
  # 阶段 4: 创建多架构 manifest
  # ============================================================================
  merge-docker:
    name: Create Release Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-docker-amd64, build-docker-arm64]
    if: always() && needs.build-docker-amd64.result == 'success' && needs.build-docker-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine manifest tags
        id: manifest-tags
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          
          if [ "$IS_PRERELEASE" = "true" ]; then
            # 预发布版本使用 pre 标签
            echo "version_tag=${IMAGE_BASE}:pre-${VERSION}" >> $GITHUB_OUTPUT
            echo "amd64_tag=${IMAGE_BASE}:pre-${VERSION}-amd64" >> $GITHUB_OUTPUT
            echo "arm64_tag=${IMAGE_BASE}:pre-${VERSION}-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=" >> $GITHUB_OUTPUT
          else
            # 正式版本使用版本号标签
            echo "version_tag=${IMAGE_BASE}:${VERSION}" >> $GITHUB_OUTPUT
            echo "amd64_tag=${IMAGE_BASE}:${VERSION}-amd64" >> $GITHUB_OUTPUT
            echo "arm64_tag=${IMAGE_BASE}:${VERSION}-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Create and push multi-arch manifest
        run: |
          VERSION_TAG="${{ steps.manifest-tags.outputs.version_tag }}"
          AMD64_TAG="${{ steps.manifest-tags.outputs.amd64_tag }}"
          ARM64_TAG="${{ steps.manifest-tags.outputs.arm64_tag }}"
          LATEST_TAG="${{ steps.manifest-tags.outputs.latest_tag }}"

          # 创建版本 tag 和 manifest
          docker buildx imagetools create \
            --tag "${VERSION_TAG}" \
            "${AMD64_TAG}" \
            "${ARM64_TAG}"

          # 如果不是预发布，创建 latest tag
          if [ -n "$LATEST_TAG" ]; then
            docker buildx imagetools create \
              --tag "${LATEST_TAG}" \
              "${AMD64_TAG}" \
              "${ARM64_TAG}"
          fi

          echo "Multi-arch manifest created successfully"

      - name: Output manifest info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          echo "Version Tag: ${{ steps.manifest-tags.outputs.version_tag }}"
          echo "Is Prerelease: ${{ needs.prepare.outputs.is_prerelease }}"
          echo "Platforms: linux/amd64, linux/arm64"

  # ============================================================================
  # 阶段 5: 创建 GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    needs: [prepare, build-windows, build-windows-arm, build-linux-x64, build-linux-arm64, build-macos-intel, build-macos-arm, build-sea-windows, build-sea-windows-arm, build-sea-linux-x64, build-sea-linux-arm64, build-sea-macos-arm, build-sea-macos-x64, merge-docker]
    # build-only 模式只跑构建与冒烟，不创建任何 Release / Tag
    if: always() && inputs.release_type != 'build-only' && (needs.build-windows.result == 'success' || needs.build-windows-arm.result == 'success' || needs.build-linux-x64.result == 'success' || needs.build-linux-arm64.result == 'success' || needs.build-macos-intel.result == 'success' || needs.build-macos-arm.result == 'success' || needs.build-sea-windows.result == 'success' || needs.build-sea-windows-arm.result == 'success' || needs.build-sea-linux-x64.result == 'success' || needs.build-sea-linux-arm64.result == 'success' || needs.build-sea-macos-arm.result == 'success' || needs.build-sea-macos-x64.result == 'success' || needs.merge-docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      changelog_content: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Windows x64 artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: ./artifacts

      - name: Download Windows ARM64 artifact
        if: needs.build-windows-arm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-arm-package
          path: ./artifacts

      - name: Download Linux x64 artifact
        if: needs.build-linux-x64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-package
          path: ./artifacts

      - name: Download Linux ARM64 artifact
        if: needs.build-linux-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-package
          path: ./artifacts

      - name: Download macOS Intel artifact
        if: needs.build-macos-intel.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-package
          path: ./artifacts

      - name: Download macOS ARM artifact
        if: needs.build-macos-arm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-package
          path: ./artifacts

      - name: Download SEA Windows x64 artifact
        if: needs.build-sea-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-windows-x64
          path: ./artifacts

      - name: Download SEA Windows ARM64 artifact
        if: needs.build-sea-windows-arm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-windows-arm64
          path: ./artifacts

      - name: Download SEA Linux x64 artifact
        if: needs.build-sea-linux-x64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-linux-x64
          path: ./artifacts

      - name: Download SEA Linux ARM64 artifact
        if: needs.build-sea-linux-arm64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-linux-arm64
          path: ./artifacts

      - name: Download SEA macOS ARM artifact
        if: needs.build-sea-macos-arm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-macos-arm
          path: ./artifacts

      - name: Download SEA macOS x64 artifact
        if: needs.build-sea-macos-x64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sea-macos-x64
          path: ./artifacts

      - name: Generate release notes
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          SECTIONS=""

          # 1. 从 CHANGELOG.md 提取当前版本日志
          if [ -f "docs/CHANGELOG.md" ]; then
            CHANGELOG_CONTENT=$(awk "/^## \\[$VERSION\\]/ {flag=1; next} /^## \\[/ {flag=0} flag" docs/CHANGELOG.md)
            if [ -n "$CHANGELOG_CONTENT" ]; then
              SECTIONS="${SECTIONS}${CHANGELOG_CONTENT}"$'\n'
            fi
          fi

          # 2. 上个标签之后的合并 PR 列表
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            SINCE=$(git log -1 --format=%aI "$PREV_TAG" 2>/dev/null || true)
            if [ -n "$SINCE" ]; then
              PR_JSON=$(gh pr list --state merged --limit 30 --json number,title,author,mergedAt --jq \
                '.[] | select(.mergedAt > "'"$SINCE"'") | "- PR #\(.number): \(.title) (@\(.author.login))"' 2>/dev/null || true)
              if [ -n "$PR_JSON" ]; then
                SECTIONS="${SECTIONS}"$'\n### 📦 合并的 Pull Request\n\n'"${PR_JSON}"$'\n'
              fi
            fi
          fi

          # 3. 变更量最大的 10 个 commit
          if [ -n "$PREV_TAG" ]; then
            TOP_COMMITS=$(git log "$PREV_TAG"..HEAD --format="%H %s" --shortstat 2>/dev/null | \
              perl -e '
                my @commits;
                my ($hash, $msg, $total);
                while (<STDIN>) {
                  chomp;
                  if (/^([0-9a-f]{40}) (.+)/) {
                    if (defined $hash) {
                      push @commits, [$total, $hash, $msg];
                    }
                    ($hash, $msg) = ($1, $2);
                    $total = 0;
                  } elsif (/(\d+) insertions?\(\+\)/ || /(\d+) deletions?\(-\)/) {
                    $total += $1 if $1;
                  }
                }
                if (defined $hash) {
                  push @commits, [$total, $hash, $msg];
                }
                @commits = sort { $b->[0] <=> $a->[0] } @commits;
                my $i = 0;
                for my $c (@commits) {
                  last if $i++ >= 10;
                  my $short = substr($c->[1], 0, 8);
                  my $msg = substr($c->[2], 0, 80);
                  printf("- [`%s`] %s (+%d lines)\n", $short, $msg, $c->[0]);
                }
              ' 2>/dev/null || true)
            if [ -n "$TOP_COMMITS" ]; then
              SECTIONS="${SECTIONS}"$'\n### 🔝 最大变更 Commit（Top 10）\n\n'"${TOP_COMMITS}"$'\n'
            fi
          fi

          if [ -z "$SECTIONS" ]; then
            SECTIONS="详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          fi

          # macOS 首次运行提示：从浏览器下载的文件带 quarantine 标记，
          # 未做公证的二进制会被 Gatekeeper 拦成「无法验证开发者」。
          # 这里把处置办法写进 Release 正文，避免用户以为包是坏的。
          if ls ./artifacts/HiDNS-*-macos-* > /dev/null 2>&1; then
            SECTIONS="${SECTIONS}"$'\n### 🍎 macOS 首次运行\n\nmacOS 会对下载的文件加隔离标记。若提示「无法打开，因为无法验证开发者」，在解压目录执行一次：\n\n```bash\nxattr -dr com.apple.quarantine ./HiDNS-*-macos-*\n```\n\n启动包（`*-Package.tar.gz`）解压后执行 `./Start-HiDNS.sh` 即可（脚本会自动切到包目录）。\n'
          fi

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 写入临时文件供 body_path 使用
          echo "$SECTIONS" > /tmp/release_body.md

      - name: Generate checksums
        run: |
          cd ./artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      # 请求了某个平台却没产出，就不要静默发一个残缺的 Release。
      # v2.1.5 就是这样：macOS Intel 包与 macOS ARM 二进制的作业被取消，
      # 发布页上直接没有这两个文件，使用者以为「macOS 分支坏了」。
      - name: Verify requested artifacts are present
        run: |
          fail=0
          check() {
            if [ "$1" = "true" ] && [ "$2" != "success" ]; then
              echo "::error::已请求 $3，但对应作业结果为 $2"
              fail=1
            fi
          }
          check "${{ inputs.build_macos_intel }}" "${{ needs.build-macos-intel.result }}" "macOS Intel 启动包"
          check "${{ inputs.build_macos_arm }}"   "${{ needs.build-macos-arm.result }}"   "macOS ARM 启动包"
          check "${{ inputs.build_exe }}"         "${{ needs.build-windows.result }}"     "Windows x64 包"
          check "${{ inputs.build_linux_x64 }}"   "${{ needs.build-linux-x64.result }}"   "Linux x64 包"
          check "${{ inputs.build_linux_arm64 }}" "${{ needs.build-linux-arm64.result }}" "Linux ARM64 包"
          if [ "${{ inputs.build_sea }}" = "true" ]; then
            for f in HiDNS-*-macos-x64 HiDNS-*-macos-arm64; do
              ls ./artifacts/$f > /dev/null 2>&1 || { echo "::error::缺少 macOS SEA 二进制: $f"; fail=1; }
            done
          fi
          if [ $fail -ne 0 ]; then
            echo "::error::产物不完整，已中止发布（不要发出残缺版本）"
            exit 1
          fi
          echo "✅ 请求的产物均已产出"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: HiDNS v${{ needs.prepare.outputs.version }}
          body_path: /tmp/release_body.md
          draft: ${{ inputs.release_type == 'draft' }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
            ./artifacts/HiDNS-*.exe
            ./artifacts/HiDNS-*-linux-x64
            ./artifacts/HiDNS-*-linux-arm64
            ./artifacts/HiDNS-*-macos-*
            ./artifacts/checksums.txt

  # ============================================================================
  # 阶段 6: 发送 Telegram 通知
  # ============================================================================
  # ============================================================================
  # build-only 模式的结果汇总
  # 该模式只跑构建与冒烟，不创建 Release / Tag；这里给出逐目标结论，
  # 并且只要「被请求的目标」有一个没成功就判失败，避免有人以为构建测试过了。
  # ============================================================================
  build-only-summary:
    name: Build-only Summary
    needs: [prepare, build-windows, build-windows-arm, build-linux-x64, build-linux-arm64, build-macos-intel, build-macos-arm, build-sea-windows, build-sea-windows-arm, build-sea-linux-x64, build-sea-linux-arm64, build-sea-macos-arm, build-sea-macos-x64, merge-docker]
    if: always() && inputs.release_type == 'build-only'
    runs-on: ubuntu-latest
    steps:
      - name: Report build results
        run: |
          {
            echo "## 🧪 构建测试（不发布）"
            echo ""
            echo "本次未创建 Release / Tag，仅验证构建产物。"
            echo ""
            echo "| 目标 | 是否请求 | 结果 |"
            echo "|------|---------|------|"
          } >> $GITHUB_STEP_SUMMARY

          fail=0
          row() {
            echo "| $1 | $2 | $3 |" >> $GITHUB_STEP_SUMMARY
            if [ "$2" = "是" ] && [ "$3" != "success" ]; then fail=1; fi
          }
          flag() { if [ "$1" = "true" ]; then echo "是"; else echo "否（已跳过）"; fi; }

          row "Windows x64 包"     "$(flag '${{ inputs.build_exe }}')"         "${{ needs.build-windows.result }}"
          row "Windows ARM 包"     "$(flag '${{ inputs.build_windows_arm }}')"  "${{ needs.build-windows-arm.result }}"
          row "Linux x64 包"       "$(flag '${{ inputs.build_linux_x64 }}')"    "${{ needs.build-linux-x64.result }}"
          row "Linux ARM64 包"     "$(flag '${{ inputs.build_linux_arm64 }}')"  "${{ needs.build-linux-arm64.result }}"
          row "macOS Intel 包"     "$(flag '${{ inputs.build_macos_intel }}')"  "${{ needs.build-macos-intel.result }}"
          row "macOS ARM 包"       "$(flag '${{ inputs.build_macos_arm }}')"    "${{ needs.build-macos-arm.result }}"
          row "Windows x64 SEA"    "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-windows.result }}"
          row "Windows ARM64 SEA"  "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-windows-arm.result }}"
          row "Linux x64 SEA"      "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-linux-x64.result }}"
          row "Linux ARM64 SEA"    "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-linux-arm64.result }}"
          row "macOS ARM64 SEA"    "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-macos-arm.result }}"
          row "macOS x64 SEA"      "$(flag '${{ inputs.build_sea }}')"          "${{ needs.build-sea-macos-x64.result }}"
          row "Docker 镜像"        "$(flag '${{ inputs.build_docker }}')"       "${{ needs.merge-docker.result }}"

          if [ $fail -ne 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**结论：有被请求的目标未成功，构建测试不通过。**" >> $GITHUB_STEP_SUMMARY
            echo "::error::构建测试不通过（详见上表）"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**结论：被请求的目标全部构建成功。**" >> $GITHUB_STEP_SUMMARY
          echo "✅ 构建测试通过"

  notify-telegram:
    name: Send Telegram Notification
    needs: [prepare, create-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Determine release type
        id: release-type
        run: |
          if [ "${{ needs.prepare.outputs.is_prerelease }}" = "true" ]; then
            echo "type=🚧 预发布版本" >> $GITHUB_OUTPUT
          else
            echo "type=🎉 正式版本发布" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          topic: 14
          format: markdown
          message: |
            *${{ steps.release-type.outputs.type }}*
            _${{ github.repository }}_
            
            *🔖 版本标签：*
            `v${{ needs.prepare.outputs.version }}`
            
            *📄 发布标题：*
            HiDNS v${{ needs.prepare.outputs.version }}
            
            *📝 更新日志：*
            ```
            ${{ needs.create-release.outputs.changelog_content }}
            ```
            
            *🔗 链接：*
            [GitHub Release 页面](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }})
            
            *📅 发布时间：*
            ${{ github.event.workflow_run.created_at || 'N/A' }}
