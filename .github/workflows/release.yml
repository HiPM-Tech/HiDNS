name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.1.0)'
        required: true
        default: ''
        type: string
      # GitHub 的 workflow_dispatch 最多 10 个 input。此前是 11 个（prerelease 与 draft 各占一个），
      # 超出的那个会被丢弃。这里把两者合并成一个选择项，保持 10 个以内。
      release_type:
        description: 'Release type (release=正式, prerelease=预发布, draft=草稿, build-only=只构建不发布)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
          - draft
          - build-only
      build_exe:
        description: 'Build Windows package?'
        required: false
        default: true
        type: boolean
      build_linux_x64:
        description: 'Build Linux x64 package?'
        required: false
        default: true
        type: boolean
      build_linux_arm64:
        description: 'Build Linux ARM64 package?'
        required: false
        default: true
        type: boolean
      build_macos_intel:
        description: 'Build macOS Intel package?'
        required: false
        default: true
        type: boolean
      build_macos_arm:
        description: 'Build macOS ARM package?'
        required: false
        default: true
        type: boolean
      build_windows_arm:
        description: 'Build Windows ARM package?'
        required: false
        default: true
        type: boolean
      build_docker:
        description: 'Build Docker image?'
        required: false
        default: true
        type: boolean
      build_sea:
        description: 'Build SEA binaries (self-contained executables)?'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 阶段 0: 发布前门禁
  # 此前 release.yml 完全没有测试步骤：打 tag 后直接构建发布，等于绕过所有门禁。
  # 这里把与 CI 同口径的检查前置，任一失败即终止发布。
  # ============================================================================
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --filter dnsmgr-server run lint
          pnpm --filter dnsmgr-client run lint

      - name: Type check & build
        run: |
          pnpm --filter dnsmgr-server run build
          pnpm --filter dnsmgr-client run build

      - name: Action namespace gate
        run: pnpm --filter dnsmgr-server run check:actions

      - name: Unit tests (vitest)
        run: pnpm --filter dnsmgr-server run test

      - name: Unit tests (node:test)
        run: pnpm --filter dnsmgr-server run test:node

  # ============================================================================
  # 阶段 1: 准备版本信息
  # ============================================================================
  prepare:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ inputs.release_type == 'prerelease' }}
      build_exe: ${{ inputs.build_exe }}
      build_linux_x64: ${{ inputs.build_linux_x64 }}
      build_linux_arm64: ${{ inputs.build_linux_arm64 }}
      build_macos_intel: ${{ inputs.build_macos_intel }}
      build_macos_arm: ${{ inputs.build_macos_arm }}
      build_windows_arm: ${{ inputs.build_windows_arm }}
      build_docker: ${{ inputs.build_docker }}
      build_sea: ${{ inputs.build_sea }}
      image_name_lower: ${{ steps.get_version.outputs.image_name_lower }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_name_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # ============================================================================
  # 阶段 2: 构建 Windows 安装包
  # ============================================================================
  build-windows:
    name: Build Windows Package
    if: inputs.build_exe == true
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create Windows ZIP Package
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release-dist"

          # Download Node.js 20
          $nodeUrl = "https://nodejs.org/dist/v24.16.0/node-v24.16.0-win-x64.zip"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "release-dist" -Force
          Rename-Item -Path "release-dist/node-v24.16.0-win-x64" -NewName "nodejs" -Force

          # Copy files
          New-Item -ItemType Directory -Force -Path "release-dist/server"
          Copy-Item -Path "server/dist" -Destination "release-dist/server/" -Recurse -Force
          Copy-Item -Path "server/package.json" -Destination "release-dist/server/" -Force

          New-Item -ItemType Directory -Force -Path "release-dist/client"
          Copy-Item -Path "client/dist" -Destination "release-dist/client/" -Recurse -Force

          # Use npm to install dependencies in the release directory
          Set-Location -Path "release-dist/server"
          npm install --production --no-package-lock
          Set-Location -Path "../../"

          # Create start script (without BOM)
          $batLines = @(
            '@echo off',
            'echo Starting HiDNS Server...',
            'set NODE_PATH=%~dp0server\node_modules',
            'set PATH=%~dp0nodejs;%PATH%',
            '"%~dp0nodejs\node.exe" "%~dp0server\dist\app.js"',
            'pause'
          )
          $batContent = $batLines -join "`r`n"
          [System.IO.File]::WriteAllText("release-dist/Start-HiDNS.bat", $batContent, [System.Text.Encoding]::ASCII)

          Compress-Archive -Path "release-dist/*" -DestinationPath "HiDNS-Windows-v$VERSION-Package.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: HiDNS-Windows-*.zip
          retention-days: 7

  # ============================================================================
  # 阶段 2.1: 构建 Windows ARM64 安装包
  # ============================================================================
  build-windows-arm:
    name: Build Windows ARM64 Package
    if: inputs.build_windows_arm == true
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create Windows ARM64 ZIP Package
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release-dist"

          # Download Node.js 20 ARM64
          $nodeUrl = "https://nodejs.org/dist/v24.16.0/node-v24.16.0-win-arm64.zip"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "release-dist" -Force
          Rename-Item -Path "release-dist/node-v24.16.0-win-arm64" -NewName "nodejs" -Force

          # Copy files
          New-Item -ItemType Directory -Force -Path "release-dist/server"
          Copy-Item -Path "server/dist" -Destination "release-dist/server/" -Recurse -Force
          Copy-Item -Path "server/package.json" -Destination "release-dist/server/" -Force

          New-Item -ItemType Directory -Force -Path "release-dist/client"
          Copy-Item -Path "client/dist" -Destination "release-dist/client/" -Recurse -Force

          # Use npm to install dependencies in the release directory
          Set-Location -Path "release-dist/server"
          npm install --production --no-package-lock
          Set-Location -Path "../../"

          # Create start script (without BOM)
          $batLines = @(
            '@echo off',
            'echo Starting HiDNS Server...',
            'set NODE_PATH=%~dp0server\node_modules',
            'set PATH=%~dp0nodejs;%PATH%',
            '"%~dp0nodejs\node.exe" "%~dp0server\dist\app.js"',
            'pause'
          )
          $batContent = $batLines -join "`r`n"
          [System.IO.File]::WriteAllText("release-dist/Start-HiDNS.bat", $batContent, [System.Text.Encoding]::ASCII)

          Compress-Archive -Path "release-dist/*" -DestinationPath "HiDNS-Windows-ARM64-v$VERSION-Package.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-package
          path: HiDNS-Windows-ARM64-*.zip
          retention-days: 7

  # ============================================================================
  # 阶段 2.2: 构建 Linux x64 启动包
  # ============================================================================
  build-linux-x64:
    name: Build Linux x64 Package
    if: inputs.build_linux_x64 == true
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create Linux x64 Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-dist

          # Download Node.js 20 x64
          NODE_URL="https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz"
          curl -L $NODE_URL -o node.tar.xz
          tar -xf node.tar.xz -C release-dist
          mv release-dist/node-v24.16.0-linux-x64 release-dist/nodejs

          # Copy files
          mkdir -p release-dist/server
          cp -r server/dist release-dist/server/
          cp server/package.json release-dist/server/

          mkdir -p release-dist/client
          cp -r client/dist release-dist/client/

          # Install production dependencies
          cd release-dist/server
          npm install --production --no-package-lock
          cd ../..

          # Create start script
          # 必须先 cd 到包所在目录：服务端用 process.cwd() 作为 APP_ROOT 去找 client/dist，
          # 从别处运行（尤其 Finder 双击时 cwd 是 /）会拿不到前端，页面 404。
          printf '#!/bin/bash\ncd "$(dirname "$0")" || exit 1\necho "Starting HiDNS Server..."\nexport NODE_PATH="$(pwd)/server/node_modules"\nexport PATH="$(pwd)/nodejs/bin:$PATH"\n"$(pwd)/nodejs/bin/node" "$(pwd)/server/dist/app.js"\n' > release-dist/Start-HiDNS.sh
          chmod +x release-dist/Start-HiDNS.sh

          # Create tar.gz package
          tar -czf "HiDNS-Linux-x64-v$VERSION-Package.tar.gz" -C release-dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-package
          path: HiDNS-Linux-x64-*.tar.gz
          retention-days: 7

  # ============================================================================
  # 阶段 2.3: 构建 Linux ARM64 启动包
  # ============================================================================
  build-linux-arm64:
    name: Build Linux ARM64 Package
    if: inputs.build_linux_arm64 == true
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create Linux ARM64 Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-dist

          # Download Node.js 20 ARM64
          NODE_URL="https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-arm64.tar.xz"
          curl -L $NODE_URL -o node.tar.xz
          tar -xf node.tar.xz -C release-dist
          mv release-dist/node-v24.16.0-linux-arm64 release-dist/nodejs

          # Copy files
          mkdir -p release-dist/server
          cp -r server/dist release-dist/server/
          cp server/package.json release-dist/server/

          mkdir -p release-dist/client
          cp -r client/dist release-dist/client/

          # Install production dependencies
          cd release-dist/server
          npm install --production --no-package-lock
          cd ../..

          # Create start script
          # 必须先 cd 到包所在目录：服务端用 process.cwd() 作为 APP_ROOT 去找 client/dist，
          # 从别处运行（尤其 Finder 双击时 cwd 是 /）会拿不到前端，页面 404。
          printf '#!/bin/bash\ncd "$(dirname "$0")" || exit 1\necho "Starting HiDNS Server..."\nexport NODE_PATH="$(pwd)/server/node_modules"\nexport PATH="$(pwd)/nodejs/bin:$PATH"\n"$(pwd)/nodejs/bin/node" "$(pwd)/server/dist/app.js"\n' > release-dist/Start-HiDNS.sh
          chmod +x release-dist/Start-HiDNS.sh

          # Create tar.gz package
          tar -czf "HiDNS-Linux-ARM64-v$VERSION-Package.tar.gz" -C release-dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: HiDNS-Linux-ARM64-*.tar.gz
          retention-days: 7

  # ============================================================================
  # 阶段 2.4: 构建 macOS Intel 启动包
  # ============================================================================
  build-macos-intel:
    name: Build macOS Intel Package
    if: inputs.build_macos_intel == true
    runs-on: macos-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create macOS Intel Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-dist

          # Download Node.js 24 x64 for macOS
          NODE_URL="https://nodejs.org/dist/v24.16.0/node-v24.16.0-darwin-x64.tar.xz"
          curl -L $NODE_URL -o node.tar.xz
          tar -xf node.tar.xz -C release-dist
          mv release-dist/node-v24.16.0-darwin-x64 release-dist/nodejs

          # Copy files
          mkdir -p release-dist/server
          cp -r server/dist release-dist/server/
          cp server/package.json release-dist/server/

          mkdir -p release-dist/client
          cp -r client/dist release-dist/client/

          # Install production dependencies
          cd release-dist/server
          npm install --production --no-package-lock
          cd ../..

          # Create start script
          # 必须先 cd 到包所在目录：服务端用 process.cwd() 作为 APP_ROOT 去找 client/dist，
          # 从别处运行（尤其 Finder 双击时 cwd 是 /）会拿不到前端，页面 404。
          printf '#!/bin/bash\ncd "$(dirname "$0")" || exit 1\necho "Starting HiDNS Server..."\nexport NODE_PATH="$(pwd)/server/node_modules"\nexport PATH="$(pwd)/nodejs/bin:$PATH"\n"$(pwd)/nodejs/bin/node" "$(pwd)/server/dist/app.js"\n' > release-dist/Start-HiDNS.sh
          chmod +x release-dist/Start-HiDNS.sh

          # Create tar.gz package
          tar -czf "HiDNS-macOS-Intel-v$VERSION-Package.tar.gz" -C release-dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-package
          path: HiDNS-macOS-Intel-*.tar.gz
          retention-days: 7

  # ============================================================================
  # 阶段 2.5: 构建 macOS ARM 启动包
  # ============================================================================
  build-macos-arm:
    name: Build macOS ARM Package
    if: inputs.build_macos_arm == true
    runs-on: macos-latest
    timeout-minutes: 45
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server build

      - name: Build client
        run: pnpm --filter dnsmgr-client build

      - name: Create macOS ARM Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-dist

          # Download Node.js 24 ARM64 for macOS
          NODE_URL="https://nodejs.org/dist/v24.16.0/node-v24.16.0-darwin-arm64.tar.xz"
          curl -L $NODE_URL -o node.tar.xz
          tar -xf node.tar.xz -C release-dist
          mv release-dist/node-v24.16.0-darwin-arm64 release-dist/nodejs

          # Copy files
          mkdir -p release-dist/server
          cp -r server/dist release-dist/server/
          cp server/package.json release-dist/server/

