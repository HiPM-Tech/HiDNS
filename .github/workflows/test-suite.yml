name: Test Suite

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - master
      - develop
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
      database:
        description: 'Database to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sqlite
          - postgresql
          - mysql

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 不得加 || true：此前两条 lint 都带容错，而 server 侧当时根本没有 lint 脚本，
      # 于是「Lint」这一步长期恒绿。现已补齐 server 配置，改成硬失败。
      - name: Run ESLint
        run: |
          pnpm --filter dnsmgr-server run lint
          pnpm --filter dnsmgr-client run lint

      - name: Type check
        run: |
          pnpm --filter dnsmgr-server run build
          pnpm --filter dnsmgr-client run build

      # 动作命名空间与唯一性门禁。**不得**附加 || echo / || true 等容错，
      # 否则该校验形同虚设（历史教训：Test Suite 曾经吞掉退出码）。
      - name: Check action namespaces & uniqueness
        run: pnpm --filter dnsmgr-server run check:actions

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/dist
            client/dist
          retention-days: 1

  unit-test-server:
    name: Unit Test - Server
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (vitest)
        run: pnpm --filter dnsmgr-server run test

      # 用 node:test 写的用例（*.test.node.ts）此前既不进 vitest 也没有任何入口，
      # 等于长期不执行；这里单独跑一遍。
      - name: Run unit tests (node:test)
        run: pnpm --filter dnsmgr-server run test:node

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./server/coverage/lcov.info
          flags: server-unit
          name: server-unit-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  unit-test-client:
    name: Unit Test - Client
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 注意：不加 `|| true`。此前该步骤永远绿，掩盖了客户端测试为 0 的事实。
      - name: Run unit tests
        run: pnpm --filter dnsmgr-client run test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./client/coverage/lcov.info
          flags: client-unit
          name: client-unit-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  test-sqlite:
    name: Test - SQLite
    needs: lint-and-build
    if: ${{ !github.event.inputs || github.event.inputs.database == 'all' || github.event.inputs.database == 'sqlite' }}
    uses: ./.github/workflows/test-database.yml
    with:
      database: sqlite
      test_type: ${{ github.event.inputs.test_type || 'all' }}

  test-postgresql:
    name: Test - PostgreSQL
    needs: lint-and-build
    if: ${{ !github.event.inputs || github.event.inputs.database == 'all' || github.event.inputs.database == 'postgresql' }}
    uses: ./.github/workflows/test-database.yml
    with:
      database: postgresql
      test_type: ${{ github.event.inputs.test_type || 'all' }}

  test-mysql:
    name: Test - MySQL
    needs: lint-and-build
    if: ${{ !github.event.inputs || github.event.inputs.database == 'all' || github.event.inputs.database == 'mysql' }}
    uses: ./.github/workflows/test-database.yml
    with:
      database: mysql
      test_type: ${{ github.event.inputs.test_type || 'all' }}

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [lint-and-build, test-sqlite]
    if: ${{ !github.event.inputs || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'e2e' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只装 chromium：api 项目不需要浏览器，chromium 覆盖 UI 用例；
      # firefox/webkit/mobile 项目不在门禁内（装全套会让该 job 多花数分钟）。
      - name: Install Playwright browsers
        run: pnpm --filter dnsmgr-e2e exec playwright install --with-deps chromium

      # E2E 需要「已初始化 + 有可登录账号」的库：空库会进入初始化向导，登录用例只能 skip。
      - name: Prepare server (build + seeded database)
        run: |
          pnpm --filter dnsmgr-server run build
          cd server
          mkdir -p data
          cat > data/.env <<EOF
          DB_TYPE=sqlite
          DB_PATH=$GITHUB_WORKSPACE/server/data/e2e.db
          JWT_SECRET=e2e-secret-for-ci-0123456789abcdef
          NODE_ENV=test
          EOF
          pnpm run test:init
          pnpm run test:seed

      - name: Start server
        run: |
          cd server
          node dist/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/init/status > /dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/init/status || { echo 'server did not start'; cat /tmp/server.log; exit 1; }

      - name: Run E2E tests
        env:
          BASE_URL: http://127.0.0.1:3001
          E2E_USERNAME: testuser
          E2E_PASSWORD: testpassword123
        run: pnpm --filter dnsmgr-e2e run test -- --project=api --project=chromium

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/server.log || true

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-test-server, unit-test-client, test-sqlite, test-postgresql, test-mysql, e2e-test]
    if: always()
    steps:
      - name: Generate test report
        run: |
          echo "# Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Build | ${{ needs.lint-and-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Test - Server | ${{ needs.unit-test-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Test - Client | ${{ needs.unit-test-client.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test - SQLite | ${{ needs.test-sqlite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test - PostgreSQL | ${{ needs.test-postgresql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test - MySQL | ${{ needs.test-mysql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Test | ${{ needs.e2e-test.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        run: |
          if [[ "${{ needs.unit-test-server.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-test-client.result }}" == "failure" ]] || \
             [[ "${{ needs.test-sqlite.result }}" == "failure" ]] || \
             [[ "${{ needs.test-postgresql.result }}" == "failure" ]] || \
             [[ "${{ needs.test-mysql.result }}" == "failure" ]]; then
            echo "Some tests failed!"
            exit 1
          fi
          echo "All tests passed!"
