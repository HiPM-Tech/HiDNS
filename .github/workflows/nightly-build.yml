name: Nightly Docker Build

# 名为 nightly 就只按计划跑：此前它挂在 push/pull_request 上，
# 每次推 main 都会构建并向 GHCR 推 ci-* 镜像，既费额度也与名字不符。
on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00

  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 阶段 1: 准备构建信息
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.vars.outputs.date_tag }}
      image_name_lower: ${{ steps.vars.outputs.image_name_lower }}
      push_enabled: ${{ steps.vars.outputs.push_enabled }}
      tag_prefix: ${{ steps.vars.outputs.tag_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build variables
        id: vars
        run: |
          echo "date_tag=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "image_name_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          # PR 构建不推送，其他情况根据输入决定
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "push_enabled=false" >> $GITHUB_OUTPUT
            echo "tag_prefix=prci" >> $GITHUB_OUTPUT
          else
            echo "push_enabled=${{ github.event.inputs.push || 'true' }}" >> $GITHUB_OUTPUT
            echo "tag_prefix=ci" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # 阶段 2: 并行构建 AMD64 和 ARM64
  # ============================================================================
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.tag_prefix }}-${{ needs.prepare.outputs.date_tag }}-amd64
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.tag_prefix }}-amd64
          no-cache: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.date_tag }}
            CI_BUILD=true

      - name: Output build info
        run: |
          echo "Platform: linux/amd64"
          echo "Tags: ${{ needs.prepare.outputs.tag_prefix }}-${{ needs.prepare.outputs.date_tag }}-amd64, ${{ needs.prepare.outputs.tag_prefix }}-amd64"

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.tag_prefix }}-${{ needs.prepare.outputs.date_tag }}-arm64
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.tag_prefix }}-arm64
          no-cache: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.date_tag }}
            CI_BUILD=true

      - name: Output build info
        run: |
          echo "Platform: linux/arm64"
          echo "Tags: ${{ needs.prepare.outputs.tag_prefix }}-${{ needs.prepare.outputs.date_tag }}-arm64, ${{ needs.prepare.outputs.tag_prefix }}-arm64"

  # ============================================================================
  # 阶段 3: 创建多架构 manifest
  # ============================================================================
  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: needs.prepare.outputs.push_enabled == 'true'
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          DATE_TAG="${{ needs.prepare.outputs.date_tag }}"
          TAG_PREFIX="${{ needs.prepare.outputs.tag_prefix }}"

          # 创建日期 tag 的 manifest
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG_PREFIX}-${DATE_TAG}" \
            "${IMAGE_BASE}:${TAG_PREFIX}-${DATE_TAG}-amd64" \
            "${IMAGE_BASE}:${TAG_PREFIX}-${DATE_TAG}-arm64"

          # 创建 ci/prci tag 的 manifest
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG_PREFIX}" \
            "${IMAGE_BASE}:${TAG_PREFIX}-amd64" \
            "${IMAGE_BASE}:${TAG_PREFIX}-arm64"

          echo "Multi-arch manifest created successfully"

      - name: Output manifest info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}"
          echo "Tags: ${{ needs.prepare.outputs.tag_prefix }}-${{ needs.prepare.outputs.date_tag }}, ${{ needs.prepare.outputs.tag_prefix }}"
          echo "Platforms: linux/amd64, linux/arm64"

  # ============================================================================
  # 阶段 4: 验证镜像
  # ============================================================================
  verify-image:
    name: Verify Image
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: always() && needs.merge.result == 'success' && needs.prepare.outputs.push_enabled == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.tag_prefix }}"
          docker pull $IMAGE
          echo "Verifying Docker image labels:"
          docker inspect $IMAGE --format='{{json .Config.Labels}}'
          echo ""
          echo "Image size:"
          docker images $IMAGE --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo ""
          echo "Manifest platforms:"
          docker manifest inspect $IMAGE | grep architecture
          echo ""
          echo "Image verification completed successfully!"
