name: Commit Checks

on:
  push:
    # 不再排除 main：此前 main 被 ignore，导致推 main 时**提交信息校验与 trufflehog
    # 密钥扫描全部跳过**——而这些恰恰是发布前最该跑的两项。
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-message:
    name: Commit Message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Messages
        run: |
          # push 事件下没有 origin/<sha> 这种引用，原来的写法恒失败、永远回落到「最近 10 条」。
          # 直接用 SHA 区间；新建分支时 before 是全 0，退回最近 10 条。
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git log --format=%s "$BEFORE..$AFTER" 2>/dev/null || git log --format=%s -n 10)
          else
            COMMITS=$(git log --format=%s -n 10)
          fi

          echo "检查提交信息..."
          echo "$COMMITS"

          FAILED=0
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            echo "检查: $commit"

            if [ ${#commit} -lt 10 ]; then
              echo "  ❌ 提交信息太短"
              FAILED=1
              continue
            fi

            # Merge / Revert 由 GitHub 或 git 生成，不套用提交信息规范
            if [[ "$commit" == Merge\ * || "$commit" == Revert\ * ]]; then
              echo "  ↷ 跳过（合并/回滚提交）"
              continue
            fi

            # 注意用 [[:space:]] 而不是 \s：正则内联在 [[ ]] 里时，shell 会吃掉反斜杠，
            # 变成字面量 s，导致所有提交都被判不合规（已在 CI 上踩过）。
            if [[ ! "$commit" =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\(.+\))?!?:[[:space:]].+ ]]; then
              echo "  ❌ 不符合提交信息规范（root.ai.md §882）"
              echo "     例如: feat: 添加新功能 / fix(dns): 修复解析超时"
              FAILED=1
            else
              echo "  ✅ 格式正确"
            fi
          done <<< "$COMMITS"

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

  quick-test:
    name: Quick Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: |
          pnpm --filter dnsmgr-server run lint
          pnpm --filter dnsmgr-client run lint

      - name: Type Check
        run: |
          # 只做类型检查，不要用 build：build 会真的产出 dist，且 --noEmit 会被追加到脚本末尾
          # （变成 node scripts/copy-icons.js --noEmit），既没做检查也不干净。
          pnpm --filter dnsmgr-server exec tsc --noEmit
          pnpm --filter dnsmgr-client exec tsc -b

      - name: Quick Unit Test
        run: |
          # 原来的 --testNamePattern="Database|Auth" 在本仓库匹配不到任何用例（测试名是中文），
          # vitest 会把 453 个用例全部 skip 后以 0 退出，等于没测。这里直接跑全量单测。
          pnpm --filter dnsmgr-server run test

  file-check:
    name: File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check File Size
        run: |
          LARGE_FILES=$(find . -type f -size +1M ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./.pnpm/*" 2>/dev/null)

          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ 发现大文件(>1MB):"
            echo "$LARGE_FILES"
          fi

      - name: Check File Encoding
        run: |
          NON_UTF8=$(file -i $(find . -type f \( -name "*.ts" -o -name "*.js" -o -name "*.json" \) ! -path "./node_modules/*" ! -path "./.git/*" ! -path "./.pnpm/*" 2>/dev/null) | grep -v "charset=utf-8" || true)

          if [ -n "$NON_UTF8" ]; then
            echo "⚠️ 发现非UTF-8编码的文件:"
            echo "$NON_UTF8"
          fi

      - name: Check Trailing Whitespace
        run: |
          TRAILING=$(grep -r -l ' $' --include="*.ts" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.pnpm . 2>/dev/null || true)

          if [ -n "$TRAILING" ]; then
            echo "⚠️ 发现行尾空格:"
            echo "$TRAILING"
          fi

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for Sensitive Patterns
        run: |
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "secret\s*=\s*['\"][^'\"]+['\"]"
            "token\s*=\s*['\"][^'\"]+['\"]"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -r -i -n "$pattern" --include="*.ts" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.pnpm . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️ 发现可能的敏感信息 ($pattern):"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "请检查上述文件是否包含敏感信息"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [commit-message, quick-test, file-check, security-check]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 提交检查摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**分支:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 提交信息 | ${{ needs.commit-message.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 快速测试 | ${{ needs.quick-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 文件检查 | ${{ needs.file-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 安全检查 | ${{ needs.security-check.result }} |" >> $GITHUB_STEP_SUMMARY
