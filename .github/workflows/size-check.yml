name: Size Check

# 量化产出体积：分别用「旧 Dockerfile（node_modules）」与「新 Dockerfile（单文件 bundle）」构建，
# 打印镜像总大小与逐层拆解。仅手动触发，不推送镜像、不发布。
on:
  workflow_dispatch:

jobs:
  docker-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史提交才能 git show 出改造前的 Dockerfile 做基线对比
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Prepare baseline Dockerfile (pre-bundle)
        run: git show c7c68221:Dockerfile > Dockerfile.baseline

      - name: Build baseline (node_modules)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.baseline
          load: true
          tags: hidns:baseline

      - name: Build bundled
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: hidns:bundled

      - name: Report
        run: |
          echo '=== baseline layers ==='
          docker history hidns:baseline --format '{{.Size}}	{{.CreatedBy}}' | head -25
          echo '=== bundled layers ==='
          docker history hidns:bundled --format '{{.Size}}	{{.CreatedBy}}' | head -25
          BASE=$(docker image inspect hidns:baseline --format '{{.Size}}')
          NEW=$(docker image inspect hidns:bundled --format '{{.Size}}')
          BASE_MB=$((BASE/1048576))
          NEW_MB=$((NEW/1048576))
          echo "baseline_mb=$BASE_MB bundled_mb=$NEW_MB"
          {
            echo '### 镜像体积对比'
            echo '| 变体 | 大小 |'
            echo '|---|---|'
            echo "| 旧（node_modules） | ${BASE_MB} MB |"
            echo "| 新（单文件 bundle） | ${NEW_MB} MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test bundled image
        run: |
          # 资源就位检查：图标与公共后缀快照都是按路径读取的，缺了不会崩但功能退化
          docker run --rm --entrypoint node hidns:bundled -e "
            const fs=require('fs');
            const checks=[
              ['/app/dist/lib/dns/providers', 'dir'],
              ['/app/dist/data/public-suffix-list.dat', 'file'],
              ['/app/node_modules/swagger-ui-dist/swagger-ui-standalone-preset.js', 'file'],
              ['/app/client/dist/index.html', 'file'],
            ];
            let bad=0;
            for (const [p,kind] of checks) {
              const ok = kind==='dir' ? fs.existsSync(p) : fs.existsSync(p);
              console.log((ok?'OK  ':'MISS') + ' ' + p);
              if (!ok) bad++;
            }
            process.exit(bad ? 1 : 0);
          "

          docker run -d --name hidns-smoke -p 3001:3001 -e DB_TYPE=sqlite -e DB_PATH=/app/data/t.db -e HIDNS_LOG_LEVEL=debug hidns:bundled
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/api/init/status >/dev/null 2>&1; then echo "ready after ${i}s"; ok=1; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w 'init/status -> %{http_code}\n' http://localhost:3001/api/init/status
          curl -fsS -o /dev/null -w 'api/docs    -> %{http_code}\n' http://localhost:3001/api/docs/
          curl -fsS -o /dev/null -w 'swagger js  -> %{http_code}\n' http://localhost:3001/api/docs/swagger-ui-standalone-preset.js
          docker logs hidns-smoke 2>&1 | tail -25
          # 公共后缀快照缺失会打这行 WARN；出现即视为回归
          if docker logs hidns-smoke 2>&1 | grep -q 'public suffix snapshot missing'; then
            echo '::error::public-suffix 快照未随镜像就位，分组会退化成 curated 列表'
            ok=0
          fi
          docker rm -f hidns-smoke
          test "$ok" = "1"
      - name: Smoke test baseline image
        run: |
          docker run -d --name hidns-smoke-base -p 3002:3001 -e DB_TYPE=sqlite -e DB_PATH=/app/data/t.db hidns:baseline
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3002/api/init/status >/dev/null 2>&1; then echo "baseline ready after ${i}s"; break; fi
            sleep 1
          done
          docker logs hidns-smoke-base 2>&1 | tail -10
          docker rm -f hidns-smoke-base

  gc-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter dnsmgr-server run build

      # 5 轮取中位数：runner 间 CPU 差异可达 15%，单轮只能看方向。
      # --trace-gc 输出每次 GC 的明细，用来统计 Scavenge / Mark-Compact 次数。
      - name: Benchmark (default V8 flags)
        run: |
          BENCH_OUT=/tmp/gc-default.json BENCH_ITERATIONS=200000 BENCH_ROUNDS=5 \
            node --trace-gc server/scripts/gc-bench.mjs > /tmp/gc-default.log 2>&1
          tail -1 /tmp/gc-default.log

      - name: "Benchmark (tuned: max-old-space=512, semi-space=32)"
        run: |
          BENCH_OUT=/tmp/gc-tuned.json BENCH_ITERATIONS=200000 BENCH_ROUNDS=5 \
            NODE_OPTIONS='--max-old-space-size=512 --max-semi-space-size=32' \
            node --trace-gc server/scripts/gc-bench.mjs > /tmp/gc-tuned.log 2>&1
          tail -1 /tmp/gc-tuned.log

      - name: Compare
        run: |
          python3 - <<'PY'
          import json, re

          def load(json_path, log_path):
              d = json.load(open(json_path))
              text = open(log_path, errors='ignore').read()
              d['scavenge'] = len(re.findall(r'\bScavenge\b', text))
              d['markCompact'] = len(re.findall(r'\bMark-Compact\b', text))
              d['markSweep'] = len(re.findall(r'\bMark-Sweep\b', text))
              return d

          a = load('/tmp/gc-default.json', '/tmp/gc-default.log')
          b = load('/tmp/gc-tuned.json', '/tmp/gc-tuned.log')
          delta = (b['opsPerSec'] / a['opsPerSec'] - 1) * 100

          print(f"default: {a['opsPerSec']} ops/s (median {a['medianMs']}ms), rounds {a['roundMs']}")
          print(f"          gc: scavenge {a['scavenge']}, mark-compact {a['markCompact']}, mark-sweep {a['markSweep']}")
          print(f"tuned:   {b['opsPerSec']} ops/s (median {b['medianMs']}ms), rounds {b['roundMs']}")
          print(f"          gc: scavenge {b['scavenge']}, mark-compact {b['markCompact']}, mark-sweep {b['markSweep']}")
          print(f"throughput delta: {delta:+.1f}%")

          with open('/tmp/summary.md', 'w') as f:
              f.write('### GC 基准（20 万次 x 5 轮，取中位数）\n\n')
              f.write('| 参数 | median ms | ops/s | Scavenge | Mark-Compact | RSS |\n|---|---|---|---|---|---|\n')
              f.write(f"| 默认 | {a['medianMs']} | {a['opsPerSec']} | {a['scavenge']} | {a['markCompact']} | {a['rssMb']}MB |\n")
              f.write(f"| max-old=512 / semi=32 | {b['medianMs']} | {b['opsPerSec']} | {b['scavenge']} | {b['markCompact']} | {b['rssMb']}MB |\n")
              f.write(f'\n吞吐差异：**{delta:+.1f}%**\n')
              f.write(f'\n各轮耗时（默认）：{a["roundMs"]}\n')
              f.write(f'各轮耗时（tuned）：{b["roundMs"]}\n')
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
