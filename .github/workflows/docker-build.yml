name: Docker Image (CI / Manual)

# 两种入口：
#   push → main：CI 构建，推 `<短SHA>-ci` 与滚动 `ci` 镜像，并清理超过 14 个的旧构建
#   workflow_dispatch：手动构建（可指定标签、beta、是否推注册表）
#
# 为什么加 push 触发：此前 Dockerfile 坏了要等到 nightly（UTC 18:00）或发版才发现。
#
# 已移除 `workflow_call`：声明了完整的一套可复用接口，但全仓没有任何工作流调用它
# （release.yml 与 nightly-build.yml 都是各自内联构建镜像）。留着只会让人以为有人在复用；
# 将来真要复用，按需重新加回即可。
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., 0.1.0)'
        required: true
        default: ''
      beta:
        description: 'Beta release (auto add -beta suffix if not present, skip latest tag)'
        required: false
        default: false
        type: boolean
      ci:
        description: 'CI build (auto add -ci suffix to tag)'
        required: false
        default: false
        type: boolean
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
env:
  REGISTRY: ghcr.io
  # Dynamically get repository name from GitHub context
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 阶段 1: 准备版本信息（单任务，为后续并行构建提供元数据）
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      processed_tag: ${{ steps.version.outputs.processed_tag }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      is_ci: ${{ steps.version.outputs.is_ci }}
      is_push_build: ${{ steps.version.outputs.is_push_build }}
      push_enabled: ${{ steps.version.outputs.push_enabled }}
      image_name: ${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process version tag
        id: version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag || inputs.tag }}"
          IS_BETA="${{ github.event.inputs.beta || inputs.beta }}"
          IS_CI="${{ github.event.inputs.ci || inputs.ci }}"
          PUSH_ENABLED="${{ github.event.inputs.push || inputs.push }}"

          # push 事件没有 inputs：标签用 `<短SHA>-ci`，并**推送到注册表**。
          #
          # IS_CI 必须一起置为 true：merge 阶段靠它决定「要不要创建 latest/beta」。
          # 只设 tag 不设 IS_CI 的话，IS_BETA 也是空，会走 elif 分支**创建 latest**——
          # 那等于每次推 main 都覆盖发版标签，是比缺构建更严重的问题。
          if [ -z "$INPUT_TAG" ]; then
            INPUT_TAG="$(echo "$GITHUB_SHA" | cut -c1-7)"
            IS_CI="true"
          fi
          if [ -z "$PUSH_ENABLED" ]; then
            PUSH_ENABLED="true"
          fi

          # Remove 'v' prefix if present
          TAG="${INPUT_TAG#v}"

          # If CI build, add '-ci' suffix
          if [ "$IS_CI" = "true" ] && [[ ! "$TAG" =~ -ci$ ]]; then
            TAG="${TAG}-ci"
          fi

          # If beta is checked and tag doesn't contain 'beta', add '-beta' suffix
          if [ "$IS_BETA" = "true" ] && [[ ! "$TAG" =~ beta ]]; then
            TAG="${TAG}-beta"
          fi

          # 只有「推 main 触发的构建」才滚动更新 `ci` 标签；
          # 手动 dispatch 的 ci 构建可能来自任意分支，不该动这个指针。
          IS_PUSH_BUILD="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            IS_PUSH_BUILD="true"
          fi

          echo "processed_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_push_build=$IS_PUSH_BUILD" >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "is_ci=$IS_CI" >> $GITHUB_OUTPUT
          echo "push_enabled=$PUSH_ENABLED" >> $GITHUB_OUTPUT
          echo "Original tag: $INPUT_TAG"
          echo "Processed tag: $TAG"
          echo "Is beta: $IS_BETA"
          echo "Is CI: $IS_CI"
          echo "Push enabled: $PUSH_ENABLED"

  # ============================================================================
  # 阶段 2: 并行构建 AMD64 和 ARM64 镜像
  # ============================================================================
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-amd64
            type=sha,prefix=,suffix=-amd64,format=short

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 推 main 的 CI 构建走 gha 缓存：否则每次从零重建，还要 QEMU 模拟 arm64，
          # 成本接近一次发版构建。手动构建仍 no-cache——发版要的是干净产物。
          no-cache: ${{ needs.prepare.outputs.is_push_build != 'true' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/amd64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-arm64
            type=sha,prefix=,suffix=-arm64,format=short

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 推 main 的 CI 构建走 gha 缓存：否则每次从零重建，还要 QEMU 模拟 arm64，
          # 成本接近一次发版构建。手动构建仍 no-cache——发版要的是干净产物。
          no-cache: ${{ needs.prepare.outputs.is_push_build != 'true' }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/arm64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # 阶段 3: 创建多架构 manifest（合并 AMD64 + ARM64）
  # ============================================================================
  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: needs.prepare.outputs.push_enabled == 'true'
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          TAG="${{ needs.prepare.outputs.processed_tag }}"
          IS_BETA="${{ needs.prepare.outputs.is_beta }}"
          IS_CI="${{ needs.prepare.outputs.is_ci }}"

          # 创建版本 tag 的 manifest
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG}" \
            "${IMAGE_BASE}:${TAG}-amd64" \
            "${IMAGE_BASE}:${TAG}-arm64"

          # 推 main 触发的构建额外维护一个滚动的 `ci` 标签，指向最新一次 main 构建。
          # 只对 push 事件生效：手动 dispatch 的 ci 构建可能来自任意分支，不该动这个指针。
          if [ "${{ needs.prepare.outputs.is_push_build }}" = "true" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:ci" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
            echo "Rolling tag updated: ci -> ${TAG}"
          fi

          # CI 构建：不创建 latest/beta tag
          if [ "$IS_CI" = "true" ]; then
            echo "CI build detected, skipping latest/beta tag creation"
          elif [ "$IS_BETA" != "true" ]; then
            # 如果不是 beta，创建 latest tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:latest" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          else
            # 如果是 beta，创建 beta tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:beta" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          fi

          echo "Multi-arch manifest created successfully"

      - name: Output manifest info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Version Tag: ${{ needs.prepare.outputs.processed_tag }}"
          echo "Is Beta: ${{ needs.prepare.outputs.is_beta }}"
          echo "Is CI: ${{ needs.prepare.outputs.is_ci }}"
          echo "Platforms: linux/amd64, linux/arm64"

  # ============================================================================
  # 阶段 4: 清理——只保留最近 14 个 *-ci 构建
  # ============================================================================
  cleanup:
    name: Prune Old CI Builds
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: always() && needs.merge.result == 'success' && needs.prepare.outputs.push_enabled == 'true' && needs.prepare.outputs.is_push_build == 'true'
    permissions:
      packages: write
    steps:
      - name: Keep only the newest 14 *-ci builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          KEEP: '14'
        run: |
          set -euo pipefail
          OWNER="$(echo "$IMAGE_NAME" | cut -d/ -f1)"
          PKG="$(echo "$IMAGE_NAME" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          API="https://api.github.com/orgs/${OWNER}/packages/container/${PKG}/versions"

          WORK="$(mktemp -d)"
          page=1
          while :; do
            body="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}?per_page=100&page=${page}") || { echo "::warning::列举镜像版本失败（网络）"; exit 0; }
            # 权限不足时 GitHub 返回 message 字段而不是数组——不静默，留可见告警
            if ! echo "$body" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "::warning::无法列举镜像版本（token 权限或包归属问题）：$(echo "$body" | jq -r '.message // "未知错误"')"
              exit 0
            fi
            n="$(echo "$body" | jq 'length')"
            [ "$n" -eq 0 ] && break
            echo "$body" > "$WORK/page-${page}.json"
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done

          [ -f "$WORK/page-1.json" ] || { echo '没有可清理的版本'; exit 0; }
          jq -s 'add' "$WORK"/page-*.json > "$WORK/all.json"

          # 按「构建」聚合：一次 CI 构建会产出 <sha>-ci、<sha>-ci-amd64、<sha>-ci-arm64 三个版本。
          # 只认 <7~40 位十六进制短SHA>-ci 形态，所以滚动 ci、latest、beta 与版本号标签都不会被碰。
          jq -r '
            [ .[]
              | { id, created_at, tags: (.metadata.container.tags // []) }
              | .build = ([ .tags[]
                            | (try capture("^(?<k>[0-9a-f]{7,40})-ci(-amd64|-arm64)?$").k catch null) ]
                          | map(select(. != null)) | first)
              | select(.build != null)
            ]
            | group_by(.build)
            | map({ build: .[0].build, created: (map(.created_at) | max), ids: map(.id) })
            | sort_by(.created) | reverse
            | .[ (env.KEEP | tonumber) : ]
            | .[].ids[]
          ' "$WORK/all.json" > "$WORK/prune.txt"

          total="$(grep -c . "$WORK/prune.txt" || true)"
          if [ "$total" -eq 0 ]; then
            echo "CI 构建数量未超过 ${KEEP}，无需清理"
            exit 0
          fi

          echo "将删除 ${total} 个旧版本（保留最近 ${KEEP} 次构建）"
          failed=0
          while read -r id; do
            [ -z "$id" ] && continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/${id}") || code=000
            case "$code" in
              204|200) echo "  已删除版本 ${id}" ;;
              *) echo "::warning::删除版本 ${id} 失败（HTTP ${code}）"; failed=$((failed+1)) ;;
            esac
          done < "$WORK/prune.txt"

          [ "$failed" -eq 0 ] || echo "::warning::有 ${failed} 个版本未能删除，下次运行会重试"
