name: Build and Push Docker Image

# 三种入口：手动、被其他工作流调用、以及**推 main 时的 CI 构建**。
#
# 为什么加 push 触发：此前 Dockerfile 坏了要等到 nightly（UTC 18:00）或发版才发现。
# push 事件会**推 `ci-<短SHA>` 镜像**到 ghcr（沿用旧 nightly 的 `ci-` 前缀），
# 但不碰 `latest`——那是发版标签，CI 构建绝不能覆盖它。
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., 0.1.0)'
        required: true
        default: ''
      beta:
        description: 'Beta release (auto add -beta suffix if not present, skip latest tag)'
        required: false
        default: false
        type: boolean
      ci:
        description: 'CI build (auto add -ci suffix to tag)'
        required: false
        default: false
        type: boolean
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  workflow_call:
    inputs:
      tag:
        description: 'Docker image tag (e.g., 0.1.0)'
        required: true
        type: string
      beta:
        description: 'Beta release (auto add -beta suffix if not present, skip latest tag)'
        required: false
        default: false
        type: boolean
      ci:
        description: 'CI build (auto add -ci suffix to tag)'
        required: false
        default: false
        type: boolean
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: string

env:
  REGISTRY: ghcr.io
  # Dynamically get repository name from GitHub context
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 阶段 1: 准备版本信息（单任务，为后续并行构建提供元数据）
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      processed_tag: ${{ steps.version.outputs.processed_tag }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      is_ci: ${{ steps.version.outputs.is_ci }}
      is_push_build: ${{ steps.version.outputs.is_push_build }}
      push_enabled: ${{ steps.version.outputs.push_enabled }}
      image_name: ${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process version tag
        id: version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag || inputs.tag }}"
          IS_BETA="${{ github.event.inputs.beta || inputs.beta }}"
          IS_CI="${{ github.event.inputs.ci || inputs.ci }}"
          PUSH_ENABLED="${{ github.event.inputs.push || inputs.push }}"

          # push 事件没有 inputs：标签用 `<短SHA>-ci`，并**推送到注册表**。
          #
          # IS_CI 必须一起置为 true：merge 阶段靠它决定「要不要创建 latest/beta」。
          # 只设 tag 不设 IS_CI 的话，IS_BETA 也是空，会走 elif 分支**创建 latest**——
          # 那等于每次推 main 都覆盖发版标签，是比缺构建更严重的问题。
          if [ -z "$INPUT_TAG" ]; then
            INPUT_TAG="$(echo "$GITHUB_SHA" | cut -c1-7)"
            IS_CI="true"
          fi
          if [ -z "$PUSH_ENABLED" ]; then
            PUSH_ENABLED="true"
          fi

          # Remove 'v' prefix if present
          TAG="${INPUT_TAG#v}"

          # If CI build, add '-ci' suffix
          if [ "$IS_CI" = "true" ] && [[ ! "$TAG" =~ -ci$ ]]; then
            TAG="${TAG}-ci"
          fi

          # If beta is checked and tag doesn't contain 'beta', add '-beta' suffix
          if [ "$IS_BETA" = "true" ] && [[ ! "$TAG" =~ beta ]]; then
            TAG="${TAG}-beta"
          fi

          # 只有「推 main 触发的构建」才滚动更新 `ci` 标签；
          # 手动 dispatch 的 ci 构建可能来自任意分支，不该动这个指针。
          IS_PUSH_BUILD="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            IS_PUSH_BUILD="true"
          fi

          echo "processed_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_push_build=$IS_PUSH_BUILD" >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "is_ci=$IS_CI" >> $GITHUB_OUTPUT
          echo "push_enabled=$PUSH_ENABLED" >> $GITHUB_OUTPUT
          echo "Original tag: $INPUT_TAG"
          echo "Processed tag: $TAG"
          echo "Is beta: $IS_BETA"
          echo "Is CI: $IS_CI"
          echo "Push enabled: $PUSH_ENABLED"

  # ============================================================================
  # 阶段 2: 并行构建 AMD64 和 ARM64 镜像
  # ============================================================================
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-amd64
            type=sha,prefix=,suffix=-amd64,format=short

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/amd64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-arm64
            type=sha,prefix=,suffix=-arm64,format=short

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/arm64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # 阶段 3: 创建多架构 manifest（合并 AMD64 + ARM64）
  # ============================================================================
  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: needs.prepare.outputs.push_enabled == 'true'
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          TAG="${{ needs.prepare.outputs.processed_tag }}"
          IS_BETA="${{ needs.prepare.outputs.is_beta }}"
          IS_CI="${{ needs.prepare.outputs.is_ci }}"

          # 创建版本 tag 的 manifest
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG}" \
            "${IMAGE_BASE}:${TAG}-amd64" \
            "${IMAGE_BASE}:${TAG}-arm64"

          # 推 main 触发的构建额外维护一个滚动的 `ci` 标签，指向最新一次 main 构建。
          # 只对 push 事件生效：手动 dispatch 的 ci 构建可能来自任意分支，不该动这个指针。
          if [ "${{ needs.prepare.outputs.is_push_build }}" = "true" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:ci" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
            echo "Rolling tag updated: ci -> ${TAG}"
          fi

          # CI 构建：不创建 latest/beta tag
          if [ "$IS_CI" = "true" ]; then
            echo "CI build detected, skipping latest/beta tag creation"
          elif [ "$IS_BETA" != "true" ]; then
            # 如果不是 beta，创建 latest tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:latest" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          else
            # 如果是 beta，创建 beta tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:beta" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          fi

          echo "Multi-arch manifest created successfully"

      - name: Output manifest info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Version Tag: ${{ needs.prepare.outputs.processed_tag }}"
          echo "Is Beta: ${{ needs.prepare.outputs.is_beta }}"
          echo "Is CI: ${{ needs.prepare.outputs.is_ci }}"
          echo "Platforms: linux/amd64, linux/arm64"

  # ============================================================================
  # 阶段 4: 清理（可选：删除单架构 tag，只保留 manifest）
  # ============================================================================
  cleanup:
    name: Cleanup Single-Arch Tags
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: always() && needs.merge.result == 'success' && needs.prepare.outputs.push_enabled == 'true'
    permissions:
      packages: write
    steps:
      - name: Delete single-arch tags from GHCR
        run: |
          # 使用 GitHub API 删除单架构标签（可选，保留它们也无妨）
          echo "Single-arch tags can be cleaned up manually if needed"
          echo "Tags to clean: ${{ needs.prepare.outputs.processed_tag }}-amd64, ${{ needs.prepare.outputs.processed_tag }}-arm64"
