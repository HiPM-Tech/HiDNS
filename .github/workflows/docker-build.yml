name: Docker Image

# 三个入口，共用同一套构建逻辑（此前是 docker-build.yml 与 nightly-build.yml 两份，
# 80% 重复，且两边都会推 `ci` 滚动标签、互相覆盖）：
#
#   push → main   CI 构建      <短SHA>-ci   + 滚动 ci
#   schedule      夜间构建     nightly-<日期> + 滚动 nightly
#   dispatch      手动构建     用户指定标签（beta 走 beta 标签，否则 latest）
#
# 滚动标签按来源分开：CI 与 nightly 抢同一个 `ci` 是合并前就存在的隐患。
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'server/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-build.yml'

  # 夜间构建：每天 UTC 18:00（沿用原 nightly-build.yml 的时间）
  schedule:
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., 0.1.0)'
        required: true
        default: ''
      beta:
        description: 'Beta release (auto add -beta suffix if not present, skip latest tag)'
        required: false
        default: false
        type: boolean
      ci:
        description: 'CI build (auto add -ci suffix to tag)'
        required: false
        default: false
        type: boolean
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
env:
  REGISTRY: ghcr.io
  # Dynamically get repository name from GitHub context
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 阶段 1: 准备版本信息（单任务，为后续并行构建提供元数据）
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      processed_tag: ${{ steps.version.outputs.processed_tag }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      is_ci: ${{ steps.version.outputs.is_ci }}
      rolling_tag: ${{ steps.version.outputs.rolling_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      push_enabled: ${{ steps.version.outputs.push_enabled }}
      # ghcr 的镜像名必须小写：build 阶段用 metadata-action（它会自动转），
      # 但 merge 阶段是裸的 docker buildx imagetools create，拿到 HiPM-Tech/HiDNS 会直接报
      # 「repository name must be lowercase」。所以这里统一输出小写名。
      image_name: ${{ steps.version.outputs.image_name_lower }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process version tag
        id: version
        run: |
          EVENT="${{ github.event_name }}"
          INPUT_TAG="${{ github.event.inputs.tag || inputs.tag }}"
          IS_BETA="${{ github.event.inputs.beta || inputs.beta }}"
          IS_CI="${{ github.event.inputs.ci || inputs.ci }}"
          PUSH_ENABLED="${{ github.event.inputs.push || inputs.push }}"
          PUSH_ENABLED="${PUSH_ENABLED:-true}"

          # 按触发来源决定标签与滚动标签。三个入口共用后面完全相同的构建逻辑。
          ROLLING_TAG=""
          case "$EVENT" in
            push)
              # CI 构建：<短SHA>-ci，并滚动更新 ci
              TAG="$(echo "$GITHUB_SHA" | cut -c1-7)-ci"
              ROLLING_TAG="ci"
              IS_CI="true"
              ;;
            schedule)
              # 夜间构建：nightly-<日期>，并滚动更新 nightly。
              # 不叫 ci —— 那样会和 CI 抢同一个滚动标签（合并前两份工作流就这么撞过）。
              TAG="nightly-$(date -u +%Y%m%d)"
              ROLLING_TAG="nightly"
              IS_CI="true"
              ;;
            *)
              # 手动 dispatch：沿用入参语义
              TAG="${INPUT_TAG#v}"
              if [ "$IS_CI" = "true" ] && [[ ! "$TAG" =~ -ci$ ]]; then
                TAG="${TAG}-ci"
              fi
              if [ "$IS_BETA" = "true" ] && [[ ! "$TAG" =~ beta ]]; then
                TAG="${TAG}-beta"
              fi
              ;;
          esac

          # IS_RELEASE 只排除 CI 构建：push 与 schedule 一律 IS_CI=true，永远不会覆盖 latest/beta。
          # beta 构建仍是「发版式」的——它要创建 beta 标签，只是不创建 latest。
          # （把 beta 也算进来会让 beta 构建什么都不建，是本次合并时踩过的回归。）
          IS_RELEASE="true"
          if [ "$IS_CI" = "true" ]; then
            IS_RELEASE="false"
          fi

          echo "image_name_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "processed_tag=$TAG" >> $GITHUB_OUTPUT
          echo "rolling_tag=$ROLLING_TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "is_ci=$IS_CI" >> $GITHUB_OUTPUT
          echo "push_enabled=$PUSH_ENABLED" >> $GITHUB_OUTPUT
          echo "Event: $EVENT"
          echo "Processed tag: $TAG"
          echo "Rolling tag: ${ROLLING_TAG:-(none)}"
          echo "Is release: $IS_RELEASE"
          echo "Push enabled: $PUSH_ENABLED"

  # ============================================================================
  # 阶段 2: 并行构建 AMD64 和 ARM64 镜像
  # ============================================================================
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-amd64
            type=sha,prefix=,suffix=-amd64,format=short

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 推 main 的 CI 构建走 gha 缓存：否则每次从零重建，两次构建（amd64 + 原生 arm64）
          # 的成本接近一次发版。手动构建仍 no-cache——发版要的是干净产物。
          no-cache: ${{ needs.prepare.outputs.rolling_tag == '' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/amd64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  build-arm64:
    name: Build ARM64
    # 原生 arm64 runner：不再用 QEMU 模拟。QEMU 下 arm64 构建要慢一个数量级，
    # 而 buildx 在原生架构上直接出镜像，platforms 仍显式写成 linux/arm64 以保持标签一致。
    runs-on: ubuntu-24.04-arm
    needs: prepare
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.processed_tag }}-arm64
            type=sha,prefix=,suffix=-arm64,format=short

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 推 main 的 CI 构建走 gha 缓存：否则每次从零重建，两次构建（amd64 + 原生 arm64）
          # 的成本接近一次发版。手动构建仍 no-cache——发版要的是干净产物。
          no-cache: ${{ needs.prepare.outputs.rolling_tag == '' }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            CI_BUILD=${{ needs.prepare.outputs.is_ci }}

      - name: Output image info
        run: |
          echo "Platform: linux/arm64"
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # 阶段 3: 创建多架构 manifest（合并 AMD64 + ARM64）
  # ============================================================================
  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: needs.prepare.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        if: needs.prepare.outputs.push_enabled == 'true'
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          TAG="${{ needs.prepare.outputs.processed_tag }}"
          IS_BETA="${{ needs.prepare.outputs.is_beta }}"
          IS_CI="${{ needs.prepare.outputs.is_ci }}"

          # 创建版本 tag 的 manifest
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG}" \
            "${IMAGE_BASE}:${TAG}-amd64" \
            "${IMAGE_BASE}:${TAG}-arm64"

          # 滚动标签：CI 构建更新 `ci`，夜间构建更新 `nightly`。
          # 两者分开是本次合并的重点——合并前两份工作流都推 `ci`，会互相覆盖。
          ROLLING_TAG="${{ needs.prepare.outputs.rolling_tag }}"
          if [ -n "$ROLLING_TAG" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:${ROLLING_TAG}" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
            echo "Rolling tag updated: ${ROLLING_TAG} -> ${TAG}"
          fi

          # 只有发版式手动构建才动 latest/beta；push 与 schedule 一律不动
          IS_RELEASE="${{ needs.prepare.outputs.is_release }}"
          if [ "$IS_RELEASE" != "true" ]; then
            echo "非发版构建，跳过 latest/beta tag 创建"
          elif [ "$IS_BETA" != "true" ]; then
            # 如果不是 beta，创建 latest tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:latest" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          else
            # 如果是 beta，创建 beta tag
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}:beta" \
              "${IMAGE_BASE}:${TAG}-amd64" \
              "${IMAGE_BASE}:${TAG}-arm64"
          fi

          echo "Multi-arch manifest created successfully"

      - name: Output manifest info
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          echo "Version Tag: ${{ needs.prepare.outputs.processed_tag }}"
          echo "Is Beta: ${{ needs.prepare.outputs.is_beta }}"
          echo "Is CI: ${{ needs.prepare.outputs.is_ci }}"
          echo "Platforms: linux/amd64, linux/arm64"

  # ============================================================================
  # 阶段 4: 清理——只保留最近 14 个 *-ci 构建
  # ============================================================================
  cleanup:
    name: Prune Old CI Builds
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: always() && needs.merge.result == 'success' && needs.prepare.outputs.push_enabled == 'true' && needs.prepare.outputs.rolling_tag != ''
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep only the newest 14 *-ci builds
        # 逻辑在 .github/scripts/prune-ci-images.sh：内联版本有 60 行、含嵌套引号的
        # curl/jq 组合，既没法本地跑也没法本地校验，改一次就要推一次才知道对不对。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          KEEP: '14'
        run: bash .github/scripts/prune-ci-images.sh

  # ============================================================================
  # 阶段 5: 验证镜像（原 nightly-build.yml 独有，合并后所有推送构建都跑）
  # ============================================================================
  verify-image:
    name: Verify Image
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: always() && needs.merge.result == 'success' && needs.prepare.outputs.push_enabled == 'true' && needs.prepare.outputs.rolling_tag != ''
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.rolling_tag }}"
          docker pull "$IMAGE"
          echo 'Verifying Docker image labels:'
          docker inspect "$IMAGE" --format='{{json .Config.Labels}}'
          echo ''
          echo 'Manifest platforms:'
          docker manifest inspect "$IMAGE" | grep architecture
          echo ''
          echo 'Image verification completed successfully!'
